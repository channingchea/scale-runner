name: scale_runner
description: "Scale Runner — a MIDI piano practice app for drilling scales, chords, and scale-running, with on-screen keys or a real keyboard."
publish_to: 'none'

version: 1.0.1+16

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # MIDI: USB + Bluetooth LE MIDI on iOS (CoreMIDI) and Android (Android MIDI API).
  flutter_midi_command: ^0.5.1

  # Persist which scales/chords the user has enabled, across launches.
  shared_preferences: ^2.5.5

  # Metronome click playback (SystemSound is silent on iOS/macOS).
  audioplayers: ^6.6.0

  # Fakeable time source for the metronome clock (fake_async controls it in
  # tests). Already a transitive dep of flutter_test, so this pins nothing new.
  clock: ^1.1.1

  # In-app purchases via RevenueCat — wraps StoreKit + Google Play Billing,
  # handles server-side receipt validation and the "pro" entitlement.
  purchases_flutter: ^9.15.0
  wakelock_plus: ^1.5.2
  package_info_plus: ^9.0.1
  share_plus: ^12.0.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Social: Supabase backend (optional sign-in, streak sync, friends,
  # applause, leaderboard). The app stays fully usable without an account.
  supabase_flutter: ^2.10.0
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^7.1.0
  app_links: ^6.4.0
  crypto: ^3.0.6
  firebase_core: ^4.12.1


# Vendored copy of flutter_midi_command 0.5.4 with the dead `jcenter()`
# repository removed from android/build.gradle.kts (JCenter was shut down and
# is unresolved on current Gradle/AGP). Remove this override once upstream ships a fix.
dependency_overrides:
  flutter_midi_command:
    path: third_party/flutter_midi_command

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.7
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  shared_preferences_platform_interface: ^2.4.2

flutter_native_splash:
  color: "#171E28"
  image: assets/icon/app_icon.png
  ios: true
  android: true
  web: false
  android_12:
    color: "#171E28"
    image: assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#171E28"
  adaptive_icon_background: "#171E28"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon_macos.png"

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/icon/

  # Brand fonts: Inter (UI) + Space Grotesk (display), bundled locally so the
  # app never fetches fonts over the network (see privacy policy).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk_500Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk_700Bold.ttf
          weight: 700
